name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-13
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: bash ./script/build.sh
        shell: bash

      - name: Smoke test
        if: runner.os != 'Windows'
        run: bash ./script/smoke-test.sh
        shell: bash

      - name: The rest of the suite, on the platform people actually run
        if: runner.os == 'macOS'
        run: |
          bash ./script/test-presets.sh
          bash ./script/test-radiobrowser.sh
          bash ./script/test-preset-strikes.sh
          bash ./script/test-preset-icons.sh
          bash ./script/fuzz-test.sh
        shell: bash

      - name: Package
        id: package
        shell: bash
        run: |
          version="2.0.0"

          out_arch="${{ matrix.arch }}"
          if [ "$out_arch" = "amd64" ]; then
             out_arch="x86_64"
          elif [ "$out_arch" = "arm64" ]; then
             out_arch="aarch64"
          fi

          target=${out_arch}-${{ matrix.os }}

          echo "packaging $target"
          stage="viritin-$version-$target"
          mkdir -p "$stage/config"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp "bin/$target/viritin.exe" "$stage/"
          else
            cp "bin/$target/viritin" "$stage/"
          fi
          cp cfg/viritin.ini "$stage/"
          cp cfg/avr.ini cfg/stations.ini cfg/podcasts.ini "$stage/config/"
          cp LICENSE.txt README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          echo "name=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$stage.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
