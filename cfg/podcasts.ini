; Podcast feeds, one per line, in the same shape as stations.ini:
;
;   Name=feed URL
;   Name=feed URL|artwork URL
;
; The feed URL is an ordinary RSS feed -- the same address a podcast app would
; take. Section names are only labels; every section is read and all its entries
; become feeds, so you can group them however you like or use one section.
;
; The artwork after "|" is optional and stands in for every episode of that
; feed, which is what a podcast app shows too.
;
; Enable this file with "Enable=1" in the [Podcasts] section of viritin.ini.

[Podcasts]
BBC The Documentary=https://podcasts.files.bbci.co.uk/p02nrsl1.rss
BBC Global News=https://podcasts.files.bbci.co.uk/p02nq0gn.rss
