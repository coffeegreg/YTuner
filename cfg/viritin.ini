[Configuration]
; Please do not change this value !
INIVersion=1.2.2

;Force the use of the selected IP address of one of the existing interfaces. 
;Leave this parameter with "default" value when you have one IP address only or you are not sure what to do.
;The application will find the IP address itself.
IPAddress=default

;This parameter may be useful in very rare cases.
;You can set this parameter to any value that will be act in the URL as a host for communication of the AVR device with the Viritin web service (e.g. : yamaha.vtuner.com, denon.vtuner.com)
;or any IP address that does not belong to the machine on which the Viritin process is running and may be useful when using proxy solutions and/or Docker containers.
;Leave this parameter with "default" value or empty when you are not sure what to do.
ActAsHost=default

;Use SSL. 1-Yes 0-No ; Default = 1
UseSSL=1

;Force HTTP code for redirect. It can be useful for PLAY endpoint. Default = 302
RedirectHTTPCode=302

;Resolve playlist links (.m3u .pls .asx .xspf) to the stream they point at.
;Many radio-browser entries are playlist wrappers that older AVRs cannot follow.
;With this enabled such stations are handed Viritin's own PLAY endpoint, which
;unwraps the playlist when the station is selected and redirects to the stream,
;so your AVR must follow HTTP redirects (see RedirectHTTPCode above).
;Stations whose link is already a direct stream are left untouched.
;HLS (.m3u8) is not resolved: its contents are not playable by these devices.
;1-Yes 0-No ; Default = 0
ResolvePlaylists=0

;Country for the "local" main menu entry, which skips the country list and goes
;straight to that country's stations. Use the name exactly as radio-browser
;spells it, e.g. Finland. Leave empty to hide the entry.
;The entry also has to appear in IdentifiersList/LabelsList in avr.ini; new
;config files include it by default. Default = empty
LocalCountry=

;Relay HTTPS-only stations over plain HTTP.
;These AVRs have no TLS, and "Protocol=all-as-http" only rewrites the scheme and
;hopes the station still answers on port 80 - which fewer and fewer do. With this
;enabled, Viritin fetches such a stream itself and re-serves it unencrypted on
;RelayPort below, so the AVR plays it as an ordinary HTTP station.
;Note that Viritin then carries the audio for as long as the station is playing,
;holding one connection and one thread per listening device. That is cheap on a
;spare machine and less welcome on a small Raspberry Pi, which is why it is off
;by default. Stations that are already plain HTTP never go through the relay.
;1-Yes 0-No ; Default = 0
RelayHTTPS=0

;TCP port for the relay above. Only opened when RelayHTTPS=1. Default = 8888
RelayPort=8888

;Log message level. 0-None, 1-Info, 2-Warning, 3-Error, 4-Debug ; Default = 0 ; Initial = 4
MessageInfoLevel=4

;Station logo icon size (width & height). Default = 200
;Some devices, such as the Pioneer N-50, require this parameter to be set to 75. (https://github.com/coffeegreg/YTuner/discussions/23#discussioncomment-12503631)
IconSize=200

;Cache icon files. 1-Yes 0-No ; Default = 1
IconCache=1

;Serve the Viritin mark for stations that have no logo of their own, instead of
;answering 404. Most radio-browser stations carry no favicon, and a receiver
;asks for a logo with HEAD before it will GET one - so a 404 is final, and the
;result is a blank tile with nothing in the log to explain it. A real Denon
;issued one icon request in a whole session of browsing, took the 404, and never
;asked again.
;Set to 0 if you would rather see your receiver's own blank tile than a mark
;that is not the station's. 1-Yes 0-No ; Default = 1
IconPlaceholder=1

;This parameter is related to this discussion https://github.com/coffeegreg/YTuner/discussions/43
;Some devices, such as the Pioneer N-50, require this parameter to be set to jpg too. (https://github.com/coffeegreg/YTuner/discussions/23#discussioncomment-12503631)
;Default: blank.
;Example: jpg
IconEndPointExtension=

;Sixteen characters string with your token. Allowed characters: 0-9 and A-F/a-f; Default=0123456789ABCDEF
;Use with care. Changing this parameter also changes the name of the AVR bookmark file(s) (unless you are using a common bookmark.xml file) and not-common filtering/configuration options ini file(s).
MyToken=0123456789ABCDEF

;One common configuration ini file (avr.ini) for all your AVR devices. Otherwise, each AVR will own its own filtering/configuration ini file. 1-Yes 0-No ; Default = 0
;One common configuration ini file also means one translator file "translator-avr.txt" for all your AVR devices. Otherwise, each AVR will own its own translator txt file like "translator-[xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx].txt".
;Translator file is a simple [name]=[value] pairs file where [name] is original English word and [value] is a tranlation for a selected laguage;
;Look at default "avr.ini" file and section [Translator] settings for more information.
CommonAVRini=1

;Cache folder location. Empty or "default" = Same as Viritin app location.
;Cache folder named "cache" contains station icon files and Radio-browser UUIDs and stations '*.cache' files.
CacheFolderLocation=default

;Config folder location. Empty or "default" = Same as Viritin app location.
;Config folder named "config" contains bookmark files and AVRs config files.
ConfigFolderLocation=default

;DB folder location. Empty or "default" = Same as Viritin app location.
;DB folder named "db" contains db files.
DBFolderLocation=default

;SQLite3 library file (with full path). Empty or "default" = Viritin will try to find DB library file.
;Applicable when RBCacheType is one of: catDB, catMemDB, catPermMemDB. 
;Windows users can get latest sqlite3.dll driver from https://www.sqlite.org/download.html . Please make sure to download the correct 64-bit or 32-bit version for your system.
;Linux / Unix (Solaris, BSD) / macOS users should have such a driver already installed by default. Please make sure you specify the path to the correct 64-bit or 32-bit library file..
;Typicaly:
;Linux64 : /usr/lib64/libsqlite3.so, /usr/lib64/libsqlite3.so.0, /usr/lib/x86_64-linux-gnu/libsqlite3.so, /usr/lib/x86_64-linux-gnu/libsqlite3.so.0, /usr/lib/aarch64-linux-gnu/libsqlite3.so, /usr/lib/aarch64-linux-gnu/libsqlite3.so.0
;Linux32 : /usr/lib/libsqlite3.so, /usr/lib/libsqlite3.so.0, /usr/lib/i386-linux-gnu/libsqlite3.so, /usr/lib/i386-linux-gnu/libsqlite3.so.0, /usr/lib/arm-linux-gnueabi/libsqlite3.so, /usr/lib/arm-linux-gnueabi/libsqlite3.so.0, , /usr/lib/arm-linux-gnueabihf/libsqlite3.so, /usr/lib/arm-linux-gnueabihf/libsqlite3.so.0
;Solaris64 : /usr/lib/64/libsqlite3.so, /usr/lib/64/libsqlite3.so.0
;Solaris32 : /usr/lib/libsqlite3.so, /usr/lib/libsqlite3.so.0
;macOS : /opt/local/lib/libsqlite3.dylib, /usr/lib/libsqlite3.dylib, /opt/local/lib/libsqlite3.0.dylib, /usr/lib/libsqlite3.0.dylib
;BSD : /usr/local/lib/libsqlite3.so, /usr/lib/libsqlite3.so, /usr/local/lib/libsqlite3.so.0, /usr/lib/libsqlite3.so.0
DBLibFile=default

[MyStations]
;Enables support for the stations list local file. 1-Yes 0-No ; Default = 1
Enable=1

;File name with your favorite stations (.ini or .yaml/.yml file without the path). Default = stations.ini
MyStationsFile=stations.ini

;MyStations auto refresh period (minutes). Only applicable when MyStationsAutoRefreshPeriod => 0. 0 or empty - No refresh ; Default = 0 
MyStationsAutoRefreshPeriod=0

[Presets]
;Curated per-country station lists, fetched from the Viritin repository and
;merged into your "My stations" menu. The point is the first five minutes:
;radio-browser carries tens of thousands of stations and holds no opinion about
;any of them, and a jog dial is a poor way to find the four you want.
;Your own stations.ini is always loaded first and always wins -- a category in
;both is merged rather than duplicated, and a station you already have is not
;added twice. Nothing here can overwrite your file.
;1-Yes 0-No ; Default = 0
Enable=0

;Which countries to fetch, as comma-separated ISO 3166-1 alpha-2 codes
;(fi, se, no, de, gb ...). Anything that is not exactly two letters is refused
;and named in the log rather than repaired. Default = empty
PresetsCountries=

;Where the lists come from. One file per country, named <code>.ini. Point this
;at your own fork or an internal server if you would rather not fetch from
;GitHub; the format is documented in presets/README.md.
;Default = https://raw.githubusercontent.com/ollisulopuisto/viritin/master/presets
PresetsURL=https://raw.githubusercontent.com/ollisulopuisto/viritin/master/presets

;How often to re-fetch, in minutes. 0 means fetch once at startup and leave it
;alone, which is right for nearly everyone: these lists change a few times a
;year. A fetch that fails keeps the cached copy, so this is never the difference
;between having a menu and not. Default = 0
PresetsAutoRefreshPeriod=0

[Podcasts]
;Enables podcasts. A feed becomes a folder and each episode a station, so the
;AVR browses and plays them exactly as it does radio -- nothing in the firmware
;has to understand podcasts.
;Episode lists are fetched when a feed is opened, not when the folder list is
;drawn, so switching this on costs nothing until you actually browse into one.
;Note that podcast enclosures are very often HTTPS-only, which these AVRs cannot
;fetch at all: if episodes list but will not play, turn on RelayHTTPS above.
;1-Yes 0-No ; Default = 0
Enable=0

;File with your podcast feeds (.ini file without the path), read from the config
;folder. See the shipped podcasts.ini for the format. Default = podcasts.ini
PodcastsFile=podcasts.ini

;How many episodes of a feed to offer, newest first. A long-running weekly show
;can carry a decade of back catalogue, which is a lot of jog dial. Default = 100
PodcastEpisodesLimit=100

;How long a fetched episode list is reused, in minutes. The AVR asks for a
;directory a screenful at a time, so without a cache every page of episodes
;would re-download the feed. Default = 60
PodcastCacheTTL=60

[Radiobrowser]
;Enables support for radio-browser.info . 1-Yes 0-No ; Default = 1
Enable=1

;Radio-browser.info API URL. Default = http://all.api.radio-browser.info ; 
;Warning! Using an IP address instead of a domain name results in faster performance, however, such a domain IP address may change 
;and result in loss of connection to radio-browser.info. It is always worth checking the current list of servers at: http://all.api.radio-browser.info/json/servers
RBAPIURL=http://all.api.radio-browser.info

;Radio-browser.info most popular stations limit. Default = 100
;Warning! Due to the filtering functionality (since Viritin version 1.1.0) performed by the client side, this value means the number of stations got from radiobrowser-info and later optionally filtered out by Viritin. 
;For this reason, the station list displayed by AVR may be significantly different from this value or even be empty.
;Determine this value for yourself based on your filtering scope.
;Applicable for [catNone,ctFile,ctMemStr] RBCacheType only.
RBPopularAndSearchStationsLimit=100

;Radio-browser.info minimum number of stations per category. Default = 1
;Applicable for [catNone,ctFile,ctMemStr] RBCacheType only.
RBMinStationsPerCategory=1

;Radio-browser.info UUIDs file cache TTL (hours) ; 0 means always valid UUID file cache (if exists) and never refreshes its content. ; Default = 0
;Applicable for [catNone,ctFile,ctMemStr] RBCacheType only.
RBUUIDsCacheTTL=0

;Radio-browser.info UUIDs file cache auto refresh. Applicable when RBUUIDsCacheTTL>0 only. 1-Yes 0-No ; Default = 0
;Applicable for [catNone,ctFile,ctMemStr] RBCacheType only.
RBUUIDsCacheAutoRefresh=0

;Use one value of set [catNone,catFile,catMemStr,catDB,catMemDB,catPermMemDB] or leave blank.
;catNone or blank = Do not use cache. Slow! 
;catFile      = Store previously browsed categories and stations in cache files. Most suitable if the amount of free memory is very small.
;catMemStr    = Store previously browsed categories and stations in memory cache. FASTEST, but may need more bytes of free memory.
;catDB        = Store ALL useful information about categories and stations of Radio-browser.info in SQLite DB file.
;               The initial DB file creation process may take a few minutes, but will remain persistent after you restart Viritin.
;               After this operation, you will no longer need access to redio-browser.info until you decide to refresh the downloaded data (when RBCacheTTL>0).
;               Keep RBCacheTTL = 0 to prevent the DB file from being rebuilt after the RBCacheTTL time expires.
;catMemDB     = Same as catDB, but the entire database is placed in memory. This solution is NOT permanent and once Viritin is down all data will be lost.
;catPermMemDB = Combination of catMemDB+catDB; The entire database is placed in memory, but it is also saved to a file and remains persistent. The best option if you have valid sqlite3 driver.
;Windows users can get sqlite3.dll driver from https://www.sqlite.org/download.html . Linux / Unix (Solaris, BSD) / macOS users should have such a driver already installed in their OS. 
;Pay attention to "DBLibFolderLocation" parameter in "Configuration" section of this ini file.
;catMemDB and catPermMemDB require additional ~30MB of free RAM to load entire database. Refreshing the database involves starting a concurrent thread that downloads the current content of the radio-browser.info resources and creates a second database while the current one is still running.
;After the process is completed, the newly created database becomes the current database and the old one is deleted. Due to this, an additional ~30MB of free memory is needed for the duration of this process.
;Additionally, data in JSON format downloaded from Radio-browser.info takes over 50MB.
;
;Tip : If you are running Viritin on a machine that does not have much computing power and you have selected one of the options [catDB,catMemDB,catPermMemDB], the process of creating a full database of all stations from Radiobrowser.info may take a very long time.
;In such a case, it is better to run Viritin on a faster machine that will quickly build the rb.db file in the db directory and then copy this file to the appropriate directory on the Viritin machine.
;Regardless, the database itself may also be slow if your CPU does not have enough computing power.
;
;Test the best option for you. Default : Slow devices = catMemStr ; Fast devices = catPermMemDB;
RBCacheType=catPermMemDB

;Radio-browser.info stations cache TTL (hours). 0 means always valid cache (if exists) and never refreshes its contents. ; Default = 0
RBCacheTTL=0

[Bookmark]
;Enables bookmarks. Your AVR must support bookmark to save stations to bookmark. 1-Yes 0-No ; Default = 1
Enable=1

;One common bookmark file (bookmark.xml) for all AVR devices. Otherwise, each AVR will own its own bookmark file. 1-Yes 0-No ; Default = 1
CommonBookmark=1

;Bookmark stations limit. ; Default = 100
BookmarkStationsLimit=100

[WebServer]
;Web server IP address. Don't change it if it's not necessary. ; "default" mean the same value as entered in IPAddress in Configuration section above.
WebServerIPAddress=default

;Web server TCP port. Don't change it if it's not necessary. ; Default = 80
WebServerPort=80

[DNSServer]
;Enable build-in DNS proxy serwer. 1-Yes 0-No ; Default = 1
Enable=1

;DNS server IP address. Don't change it if it's not necessary. ; "default" mean the same value as entered in IPAddress in Configuration section above.
DNSServerIPAddress=default

;DNS server UDP port. Don't change it if it's not necessary. ; Default = 53
DNSServerPort=53

;DNs to intercept. Values must by comma separated. The wildcard character (*) is only accepted at the beginning of a domain name.
;Each of these is a station directory that is dead or has dropped its users.
;wifiradiofrontier.com is Frontier Silicon's -- Hama, Medion, Technisat,
;Teufel, Roberts, Pure, Sangean, Auna, Karcher and others. Those radios used
;vTuner as their directory until Frontier dropped it in May 2019, and they
;speak the same protocol on a deeper URL path, so this server can answer them.
;Not listed on purpose: frontier-nuvola.net. Nuvola shut down on 2024-10-31,
;but it was handed over to airable rather than switched off, so radios from
;brands that signed with airable still reach a working service under those
;names. Add it by hand only if your brand was dropped in that handover --
;see doc/OTHER-PORTALS.md.
;Note: this key is only written when it is missing, so an existing viritin.ini
;keeps whatever it already has -- add the new name by hand to pick it up.
;radiodenon.com and radioharmankardon.com are here on DNS evidence rather than a
;device report: each has its own A record pointing where a known vTuner host
;points. If your receiver asks for a name that is not here, MessageInfoLevel=4
;logs it as "DNS query not intercepted" -- please report it. See doc/DEVICES.md.
InterceptDNs=*.vtuner.com,*.radiosetup.com,*.my-noxon.net,*.radiomarantz.com,*.radiodenon.com,*.radioharmankardon.com,*.wifiradiofrontier.com

;DNS servers IP Addresses. Values must by comma separated. Default = 8.8.8.8,9.9.9.9
DNSServers=8.8.8.8,9.9.9.9

;Address to put in intercepted answers.
;Empty means "the address the query arrived on", which is correct on a LAN.
;Behind NAT - a VPS, or any host whose public address is not on its interface -
;that is the private address and your AVR cannot reach it, so set the public
;address here. See doc/REMOTE-HOSTING.md. Default = empty
DNSAdvertiseIP=

;Only forward non-intercepted lookups for clients we already know.
;Leave 0 on a home network: every device using this as its resolver keeps
;working. Set to 1 when the service is reachable from the internet, so it is not
;an open resolver - vtuner.com names are still answered for anyone, but anything
;else is refused unless the client has been seen on the web service (which any
;AVR pointed at this server will have been) or is listed below.
;1-Yes 0-No ; Default = 0
RestrictForwarding=0

;Extra clients always allowed to have lookups forwarded, comma separated.
;Only consulted when RestrictForwarding=1. Default = empty
AllowedClients=

[MaintenanceServer]
;Enables support for the maintenace service. 1-Yes 0-No ; Default = 0
;With this release of Viritin only one is available: http://[MaintenanceServerIPAddress]:[MaintenanceServerPort]/viritin/down - Shut down Viritin service.
;(/ytuner/down still answers, for anything scripted against the old name.)
;Be carefull: It is unwise to run this service on an IP address other than local loopback interface;
Enable=0

;Maintenace server IP address. Don't change it if it's not necessary. ; "default" mean "127.0.0.1" loopback interface.
MaintenanceServerIPAddress=127.0.0.1

;Maintenance server TCP Port. Don't change it if it's not necessary. ; Default = 8750
;This was 8080 up to and including 1.2.6. Existing ini files keep whatever
;they already have; only a file without this key gets the new default.
MaintenanceServerPort=8750

[WebGUI]
;Browser-based editor for your "My Stations" list, on its own listener so it can
;be bound and firewalled separately from the port your AVR uses.
;It refuses to start without a password, and answers only 127.0.0.1 unless told
;otherwise - if you widen that, put it behind a firewall or a VPN, because this
;editor writes to your config files.
;1-Yes 0-No ; Default = 0
Enable=0

;Which clients the editor answers. Note this is a client filter, not a bind
;address: TFPHTTPServer only gained a bind address in FPC 3.3, so on the
;compiler this is built with the port is open on every interface whatever you
;put here, and requests from anywhere else are refused with 503.
;
;Takes a comma-separated list, and an entry may be an IPv4 range:
;  WebGUIIPAddress=192.168.1.0/24        your LAN, and nothing else
;  WebGUIIPAddress=127.0.0.1,192.168.1.5 this machine and one phone
;A range is what you want for a phone, whose address moves; naming the phone
;exactly means editing this file every time its lease changes.
;
;Use "default" or 0.0.0.0 to accept any client - needed when the editor runs in
;a container or on a remote host, and a much larger promise than a range on a
;service that writes your configuration files. Default = 127.0.0.1
WebGUIIPAddress=127.0.0.1

;Port for the editor. Default = 8090
WebGUIPort=8090

;Credentials for the editor (HTTP Basic). There is no default password and the
;editor will not start until you set one.
WebGUIUser=admin
WebGUIPassword=

;Address of the receiver the web remote drives, as "host" or "host:port".
;Leave empty to turn the remote off.
;
;With the AVR on Internet Radio, the list it is showing is Viritin's own menu -
;the receiver is our client - and its web interface exposes that list and the
;cursor keys over plain HTTP. Pointing this at the receiver gives you that menu
;in a browser at /remote, with a real keyboard for search instead of the
;on-screen character picker. Clicking a line walks the receiver's cursor to it
;and presses Enter, which is the cursor keys counted for you.
;
;The browser cannot reach the receiver by itself (different origin, and the
;receiver sends no CORS headers), so every command is proxied through here and
;checked against a fixed list first. The receiver's own interface has no
;authentication at all, so whoever can reach this port can drive the amplifier:
;it is behind WebGUIPassword for that reason. Default = empty
RemoteAVRAddress=
